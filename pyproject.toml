[project]
name = "mcp-document-search"
version = "0.1.0"
description = "MCP document search"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0,<2.0.0", "pydantic>=2.0", "fastapi>=0.110", "uvicorn[standard]>=0.27", "pymupdf>=1.24", "python-pptx", "python-docx", "openpyxl"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["server", "server.*"]
exclude = ["tests", "tests.*", "web", "web.*"]